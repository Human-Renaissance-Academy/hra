name: Web portal final formatting snapshot (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    if: github.event.pull_request.head.ref == 'feat/632-minimal-member-portal'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - name: Format and print read-only snapshot
        run: |
          npx prettier --write "src/app/(member)/resources/page.tsx"
          node -e 'for (const f of process.argv.slice(1)) { console.log("HRA_FMT_BEGIN:"+f); const s=require("node:fs").readFileSync(f).toString("base64"); for(let i=0;i<s.length;i+=500) console.log("HRA_FMT_CHUNK:"+s.slice(i,i+500)); console.log("HRA_FMT_END:"+f); }' \
            'src/app/(member)/resources/page.tsx'
